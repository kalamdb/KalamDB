# Minimal KalamDB Server Configuration - Node 1 (Docker Cluster)

[server]
host = "0.0.0.0"
port = 2900

[storage]
data_path = "/data"

[limits]

[logging]

[performance]

[cluster]
cluster_id = "docker-cluster"
node_id = 1
rpc_addr = "kalamdb-node1:2910"
api_addr = "http://kalamdb-node1:2900"

[[cluster.peers]]
node_id = 2
rpc_addr = "kalamdb-node2:2910"
api_addr = "http://kalamdb-node2:2900"

[[cluster.peers]]
node_id = 3
rpc_addr = "kalamdb-node3:2910"
api_addr = "http://kalamdb-node3:2900"
