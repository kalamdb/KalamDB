# Hint bindgen towards Command Line Tools libclang on macOS hosts.
# Allow linker_messages: Apple ld warns when __eh_frame exceeds 16MB (large
# Rust bins); rustc surfaces it as warn(linker_messages) on every large link.
[target.aarch64-apple-darwin]
rustflags = [
    "-C", "link-arg=-Wl,-rpath,/Library/Developer/CommandLineTools/usr/lib",
    "-Z", "threads=8",
    "-A", "linker_messages",
]

[target.aarch64-apple-darwin.env]
LIBCLANG_PATH = "/Library/Developer/CommandLineTools/usr/lib"
DYLD_FALLBACK_LIBRARY_PATH = "/Library/Developer/CommandLineTools/usr/lib"
DYLD_LIBRARY_PATH = "/Library/Developer/CommandLineTools/usr/lib"

[target.x86_64-apple-darwin]
rustflags = [
    "-C", "link-arg=-Wl,-rpath,/Library/Developer/CommandLineTools/usr/lib",
    "-Z", "threads=8",
    "-A", "linker_messages",
]

[target.x86_64-apple-darwin.env]
LIBCLANG_PATH = "/Library/Developer/CommandLineTools/usr/lib"
DYLD_FALLBACK_LIBRARY_PATH = "/Library/Developer/CommandLineTools/usr/lib"
DYLD_LIBRARY_PATH = "/Library/Developer/CommandLineTools/usr/lib"

# --- WASM target - no special flags (avoid macOS linker flags) ---
[target.wasm32-unknown-unknown]
rustflags = []

# --- Windows (GNU/MinGW) ---
[target.x86_64-pc-windows-gnu]
# Static linking for libstdc++ and libgcc to avoid DLL dependencies
# This ensures the binary runs without needing MinGW runtime DLLs
# -static: link all libraries statically
# -static-libgcc: statically link libgcc
# -static-libstdc++: statically link libstdc++
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "link-args=-static -static-libgcc -static-libstdc++",
    "-Z", "threads=8",
]

# --- Windows (MSVC) ---
# V8 and RocksDB both emit std::exception_ptr. Without /FORCE:MULTIPLE, link.exe
# fails with LNK2005/LNK1169. Release CI also emits this from backend/build.rs
# because CARGO_ENCODED_RUSTFLAGS="" overrides these rustflags.
[target.x86_64-pc-windows-msvc]
rustflags = [
    "-Z", "threads=8",
    "-C", "link-arg=/FORCE:MULTIPLE",
]

[build]
# Local rebuilds use incremental artifacts. CI sets CARGO_INCREMENTAL=0 so
# runners do not keep those caches.
incremental = true
rustflags = ["-Z", "threads=8"]

# Cranelift is not the default codegen backend. It drops aws-lc-sys C symbols
# (`__aws_lc_0_41_0_*`) when linking kalamdb-server on aarch64-apple-darwin.

# Use sparse registry protocol for faster dependency resolution
[registries.crates-io]
protocol = "sparse"