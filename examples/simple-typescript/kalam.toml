[project]
name = "realtime-ops-feed"
default_env = "dev"
package_manager = "npm"

[connection.dev]
url = "http://localhost:2900"
namespace = "demo"

[schema]
mode = "sql"
path = "kalam/schema.sql"
watch = true
languages = ["typescript"]

[schema.targets.typescript]
output = "src/schema.generated.ts"

[migrations]
auto_create = true

[dev]
auto_start_db = true
apply_schema = true
generate_types = true
watch = true

[dev.processes]
app = "npm run dev"

[logging]
file = true
capture_process_output = true
