services:
  kalamdb:
    image: jamals86/kalamdb:latest
    container_name: kalamdb-chat-starter
    ports:
      - "8080:8080"
    environment:
      KALAMDB_SERVER_HOST: "0.0.0.0"
      KALAMDB_ROOT_PASSWORD: "kalamdb-dev-password"
      KALAMDB_JWT_SECRET: "starter-dev-secret-key-minimum-32-characters-long"
      KALAMDB_ALLOW_REMOTE_SETUP: "true"
      KALAMDB_SECURITY_CORS_ALLOWED_ORIGINS: "*"
      RUST_LOG: "${RUST_LOG:-info}"
    volumes:
      - kalamdb_data:/data
      - ./server.toml:/config/server.toml:ro
    restart: unless-stopped

volumes:
  kalamdb_data:
