[project]
name = "live-okf-context-sync"
default_env = "dev"
package_manager = "npm"

[connection.dev]
url = "http://localhost:2900"
namespace = "okf_sync"

[schema]
mode = "sql"
path = "kalam/schema.sql"
watch = true
languages = ["typescript"]

[schema.targets.typescript]
output = "src/models/schema.generated.ts"

[migrations]
auto_create = true

[dev]
auto_start_db = true
apply_schema = true
generate_types = true
watch = true

[dev.processes]
sync = "npm run dev -- data"

[logging]
file = true
capture_process_output = true
