[project]
name = "live-okf-context-sync"
default_env = "dev"
package_manager = "npm"

[connection.dev]
url = "http://localhost:2900"
namespace = "okf_sync"

[schema]
mode = "sql"
path = "kalam/schema.sql"
watch = true
languages = ["typescript"]

[schema.targets.typescript]
output = "src/schema.generated.ts"

[migrations]
auto_create = true

[dev]
auto_start_db = true
apply_schema = true
generate_types = true
watch = true

# The agent is a one-shot demo (`npm run dev:agent`), so it is intentionally not
# a managed dev process. `kalam dev` keeps the database, schema/type generation,
# the sync worker, and the web UI running.
[dev.processes]
sync = "npm run dev:sync"
web = "npm run dev:web"

[logging]
file = true
capture_process_output = true
