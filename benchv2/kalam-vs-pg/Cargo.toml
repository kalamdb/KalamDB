[package]
name = "kalam-vs-pg"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "KalamDB (pgwire + HTTP) vs PostgreSQL comparison"

[[bin]]
name = "kalam_vs_pg_kalamdb"
path = "src/bin/kalamdb.rs"

[[bin]]
name = "kalam_vs_pg_kalamdb_http"
path = "src/bin/kalamdb_http.rs"

[[bin]]
name = "kalam_vs_pg_postgres"
path = "src/bin/postgres.rs"

[dependencies]
anyhow = "1"
crossbeam-queue = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tokio-postgres = "0.7"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
