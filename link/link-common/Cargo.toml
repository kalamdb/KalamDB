[package]
name = "link-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared Rust implementation for KalamDB link crates"
keywords = ["kalamdb", "database", "client", "websocket"]
categories = ["database", "web-programming::websocket"]
readme = "README.md"

[dependencies]
kalamdb-commons = { workspace = true, default-features = false, features = ["serde"] }
tokio = { version = "1.52.3", optional = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { workspace = true, default-features = false, features = ["json", "rustls"], optional = true }
tokio-tungstenite = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
rmp-serde = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
http-body = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
base64 = { workspace = true }
futures-util = { workspace = true, default-features = false, optional = true }
log = { workspace = true, optional = true }
miniz_oxide = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustls = { workspace = true, features = ["aws_lc_rs"], optional = true }

[features]
default = []
commons-sdk = ["kalamdb-commons/websocket-auth"]
client-core = [
	"commons-sdk",
	"dep:futures-util",
	"dep:log",
	"dep:miniz_oxide",
	"dep:rmp-serde",
]
tokio-runtime = ["client-core", "tokio", "reqwest", "tokio-tungstenite", "bytes", "dep:rustls"]
auth-flows = []
setup = []
healthcheck = []
cluster = []
consumer = ["commons-sdk"]
file-uploads = ["bytes", "http-body", "http-body-util", "reqwest/multipart", "reqwest/stream"]
http2 = ["reqwest/http2"]
e2e-tests = []

[lib]
crate-type = ["rlib"]
