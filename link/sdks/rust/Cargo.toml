[package]
name = "kalam-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Official Rust SDK for KalamDB — SQL, materialized live rows, and optional topic consumers"
readme = "README.md"
documentation = "https://docs.rs/kalam-client"
homepage = "https://kalamdb.org/docs/sdk/rust"
keywords = ["kalamdb", "database", "client", "websocket", "realtime"]
categories = ["database", "web-programming::websocket", "asynchronous"]

[dependencies]
link-common = { workspace = true, default-features = false }

[features]
default = ["native-sdk"]
tokio-runtime = ["link-common/tokio-runtime"]
auth-flows = ["link-common/auth-flows"]
setup = ["link-common/setup"]
healthcheck = ["link-common/healthcheck"]
cluster = ["link-common/cluster"]
consumer = ["link-common/consumer"]
file-uploads = ["link-common/file-uploads"]
native-sdk = ["tokio-runtime", "auth-flows"]
native-bench = ["native-sdk", "healthcheck", "setup", "consumer"]
native-cli = ["native-sdk", "healthcheck", "setup", "cluster", "consumer", "file-uploads"]
native-full = ["native-cli"]
http2 = ["link-common/http2"]
e2e-tests = ["native-cli", "link-common/e2e-tests"]

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"
required-features = ["e2e-tests"]

[[test]]
name = "test_consumer"
path = "tests/test_consumer.rs"
required-features = ["e2e-tests"]

[[test]]
name = "test_user_table_subscriptions"
path = "tests/test_user_table_subscriptions.rs"
required-features = ["e2e-tests"]

[[test]]
name = "test_websocket_integration"
path = "tests/test_websocket_integration.rs"
required-features = ["e2e-tests"]

[[test]]
name = "test_subscription_cleanup"
path = "tests/test_subscription_cleanup.rs"
required-features = ["e2e-tests"]

[[test]]
name = "proxied"
path = "tests/proxied.rs"
required-features = ["e2e-tests"]

[[test]]
name = "test_files"
path = "tests/test_files.rs"
required-features = ["e2e-tests"]

[[test]]
name = "offline_api"
path = "tests/offline_api.rs"

[[test]]
name = "query_api"
path = "tests/query_api.rs"
required-features = ["e2e-tests"]

[[test]]
name = "healthcheck_api"
path = "tests/healthcheck_api.rs"
required-features = ["e2e-tests"]

[[test]]
name = "consumer_api"
path = "tests/consumer_api.rs"
required-features = ["e2e-tests"]

[[test]]
name = "live_rows"
path = "tests/live_rows.rs"
required-features = ["e2e-tests"]

[[test]]
name = "connection_lifecycle"
path = "tests/connection_lifecycle.rs"
required-features = ["e2e-tests"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tokio-netem = { workspace = true }
kalamdb-configs = { workspace = true }
kalamdb-server = { workspace = true }
tempfile = { workspace = true }
ntest = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }

[lib]
crate-type = ["rlib"]
