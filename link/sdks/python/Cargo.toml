[package]
name = "kalamdb-python"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
description = "Python SDK for KalamDB — SQL-first realtime database"
keywords = ["kalamdb", "database", "python", "sdk"]

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
kalam-client = { workspace = true, features = ["native-sdk", "consumer", "file-uploads"] }
pyo3 = { workspace = true, features = ["extension-module"] }
pyo3-async-runtimes = { workspace = true, features = ["tokio-runtime"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
