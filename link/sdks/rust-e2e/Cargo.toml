[package]
name = "kalam-client-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Server-backed integration tests for kalam-client (not published)"
publish = false

[dev-dependencies]
kalam-client = { workspace = true, features = ["native-cli"] }
kalamdb-configs = { workspace = true }
kalamdb-server = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
tokio-netem = { workspace = true }
tempfile = { workspace = true }
ntest = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

