name: kalam_sync_example
description: Offline-first Flutter chat example for kalam_sync, kalam_sync_generator, and kalam_link.
publish_to: none
version: 0.5.6-rc.0

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  kalam_sync:
    path: ..
  kalam_sync_generator_example:
    path: ../../generator/example

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
