name: kalam_link
description: Flutter database client for KalamDB with realtime SQL subscriptions, typed queries, and JWT/OIDC authentication.
version: 0.8.0
homepage: https://kalamdb.org
repository: https://github.com/kalamdb/KalamDB
issue_tracker: https://github.com/kalamdb/KalamDB/issues
documentation: https://kalamdb.org/docs/dart-sdk/setup
topics:
  - realtime
  - database
  - sql
  - websocket
  - flutter

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: ^2.13.0
  freezed_annotation: ^3.1.0
  logger: ^2.7.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Keep build_runner on 2.15.0: newer releases require analyzer >=13, which is
  # incompatible with freezed 3.2.5 (analyzer <11) on current Flutter/Dart.
  build_runner: 2.15.0
  freezed: ^3.2.5
