name: kalam_link
description: KalamDB client SDK for Dart and Flutter — queries, live subscriptions, and authentication
version: 0.6.0-rc.0
homepage: https://github.com/kalamdb/KalamDB
repository: https://github.com/kalamdb/KalamDB

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: ^2.13.0
  freezed_annotation: ^3.1.0
  logger: ^2.7.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Keep build_runner on 2.15.0: newer releases require analyzer >=13, which is
  # incompatible with freezed 3.2.5 (analyzer <11) on current Flutter/Dart.
  build_runner: 2.15.0
  freezed: ^3.2.5
