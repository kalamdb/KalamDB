name: TypeScript SDK

on:
  push:
    branches: [main]
    paths:
      - 'link/sdks/typescript/**'
      - 'link/kalam-client/**'
      - 'link/kalam-consumer-wasm/**'
      - 'link/link-common/**'
      - 'backend/server.example.toml'
      - 'scripts/download-release-server.sh'
      - 'scripts/resolve-latest-release-asset.py'
      - 'scripts/start-sdk-test-server.sh'
      - 'scripts/test-typescript-sdk-release.sh'
      - 'versions.json'
      - 'scripts/versions.py'
      - '.github/workflows/typescript-sdk.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish TypeScript SDK packages to npm"
        type: boolean
        required: false
        default: false
      publish_github_packages:
        description: "Publish TypeScript SDK packages to GitHub Packages"
        type: boolean
        required: false
        default: false
      force_publish:
        description: "Force republish (unpublish existing version first)"
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      publish:
        description: "Publish TypeScript SDK packages to npm"
        type: boolean
        required: false
        default: false
      publish_github_packages:
        description: "Publish TypeScript SDK packages to GitHub Packages"
        type: boolean
        required: false
        default: false
      force_publish:
        description: "Force republish (unpublish existing version first)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.92.0"
  WASM_PACK_VERSION: "0.15.0"
  RUSTC_WRAPPER: ""
  CARGO_BUILD_RUSTC_WRAPPER: ""

jobs:
  resolve_versions:
    name: Resolve TypeScript SDK Version
    runs-on: ubuntu-latest
    outputs:
      root_version: ${{ steps.versions.outputs.root_version }}
      typescript_version: ${{ steps.versions.outputs.typescript_version }}
      latest_server_release_tag: ${{ steps.latest_server.outputs.release_tag }}
      selected_server_version: ${{ steps.latest_server.outputs.selected_version }}
      selected_server_selection_reason: ${{ steps.latest_server.outputs.selection_reason }}
      latest_server_asset_name: ${{ steps.latest_server.outputs.asset_name }}
      latest_server_asset_api_url: ${{ steps.latest_server.outputs.asset_api_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify versions.json
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/versions.py verify

      - name: Resolve versions from versions.json
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/versions.py github-outputs --github-output "$GITHUB_OUTPUT" --repository "$GITHUB_REPOSITORY"

      - name: Resolve latest released server asset
        id: latest_server
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/resolve-latest-release-asset.py \
            --repository "$GITHUB_REPOSITORY" \
            --github-output "$GITHUB_OUTPUT" \
            --token "$GITHUB_TOKEN" \
            --preferred-version "${{ steps.versions.outputs.root_version }}" \
            --asset-pattern '^kalamdb-server-.*-linux-x86_64\.tar\.gz$'

  download_release_server_binary:
    name: Download Latest Released SDK Server Binary
    runs-on: ubuntu-latest
    needs: resolve_versions
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download latest release server asset
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/download-release-server.sh \
            "${{ needs.resolve_versions.outputs.latest_server_asset_name }}" \
            "${{ needs.resolve_versions.outputs.latest_server_asset_api_url }}" \
            "$PWD/release-server/kalamdb-server"
          echo "Using SDK test server release ${{ needs.resolve_versions.outputs.latest_server_release_tag }} (${{ needs.resolve_versions.outputs.selected_server_version }}, ${{ needs.resolve_versions.outputs.selected_server_selection_reason }}) for requested version ${{ needs.resolve_versions.outputs.root_version }}"

      - name: Upload SDK test server binary
        uses: actions/upload-artifact@v6
        with:
          name: sdk-test-server-linux-x86_64
          path: release-server/kalamdb-server
          if-no-files-found: error

  test_packages:
    name: TypeScript SDK Tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    needs:
      - resolve_versions
      - download_release_server_binary
    strategy:
      fail-fast: false
      matrix:
        package: [client, consumer, orm, react]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download server binary
        uses: actions/download-artifact@v6
        with:
          name: sdk-test-server-linux-x86_64
          path: .

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev pkg-config libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: sdk-tests-typescript
          cache-on-failure: true

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install wasm-pack
        shell: bash
        run: |
          set -euo pipefail
          cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked
          wasm-pack --version

      - name: Prepare server binary
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./kalamdb-server
          echo "SDK test source: latest-release"

      - name: Run TypeScript SDK package tests
        id: run_tests
        continue-on-error: true
        shell: bash
        env:
          KALAMDB_URL: "http://localhost:2900"
          KALAMDB_USER: "admin"
          KALAMDB_PASSWORD: "kalamdb123"
          KALAMDB_ROOT_PASSWORD: "kalamdb123"
          KALAMDB_SERVER_BIN: ${{ github.workspace }}/kalamdb-server
          TS_SDK_PACKAGES: ${{ matrix.package }}
          TS_SDK_SERVER_LOG: ${{ github.workspace }}/ts-sdk-${{ matrix.package }}-server.log
          TS_SDK_TEST_OUTPUT: ${{ github.workspace }}/ts-sdk-test-output-${{ matrix.package }}.txt
        run: |
          set -euo pipefail
          ./scripts/test-typescript-sdk-release.sh

      - name: Verify TypeScript package test coverage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          output="ts-sdk-test-output-${{ matrix.package }}.txt"
          if ! grep -q "Running @kalamdb/${{ matrix.package }} tests" "$output"; then
            echo "Missing @kalamdb/${{ matrix.package }} npm package test run in ${output}" >&2
            exit 1
          fi

      - name: Print TypeScript SDK server log
        if: always()
        shell: bash
        run: |
          echo "=== TypeScript SDK server log ==="
          cat "ts-sdk-${{ matrix.package }}-server.log" || true

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ts-sdk-server-log-${{ matrix.package }}
          path: ts-sdk-${{ matrix.package }}-server.log
          if-no-files-found: ignore

      - name: Upload TypeScript SDK test output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ts-sdk-test-output-${{ matrix.package }}
          path: ts-sdk-test-output-${{ matrix.package }}.txt
          if-no-files-found: ignore

      - name: Fail if TypeScript SDK tests failed
        if: always() && steps.run_tests.outcome != 'success'
        shell: bash
        run: |
          echo "TypeScript SDK tests failed for ${{ matrix.package }}" >&2
          exit 1

  summarize_tests:
    name: Summarize TypeScript SDK Tests
    runs-on: ubuntu-latest
    needs: test_packages
    if: ${{ always() && needs.test_packages.result != 'cancelled' }}
    outputs:
      total: ${{ steps.parse_badge.outputs.total }}
      passed: ${{ steps.parse_badge.outputs.passed }}
      failed: ${{ steps.parse_badge.outputs.failed }}
      message: ${{ steps.parse_badge.outputs.message }}
      color: ${{ steps.parse_badge.outputs.color }}
    steps:
      - name: Download TypeScript SDK test outputs
        uses: actions/download-artifact@v6
        with:
          pattern: ts-sdk-test-output-*
          path: ts-sdk-test-artifacts
          merge-multiple: true

      - name: Parse TypeScript SDK test counts
        id: parse_badge
        shell: bash
        env:
          JOB_RESULT: ${{ needs.test_packages.result }}
        run: |
          set -euo pipefail
          python3 <<'PYTHON'
          import os
          import re
          from pathlib import Path

          artifacts_dir = Path("ts-sdk-test-artifacts")
          expected_packages = {"client", "consumer", "orm", "react"}
          found_packages = set()
          total = 0
          passed = 0
          failed = 0

          for output_path in artifacts_dir.glob("ts-sdk-test-output-*.txt"):
              package = output_path.stem.removeprefix("ts-sdk-test-output-")
              found_packages.add(package)
              text = output_path.read_text(encoding="utf-8", errors="replace")
              total += sum(int(value) for value in re.findall(r"^(?:#|ℹ) tests (\d+)$", text, flags=re.MULTILINE))
              passed += sum(int(value) for value in re.findall(r"^(?:#|ℹ) pass (\d+)$", text, flags=re.MULTILINE))
              failed += sum(int(value) for value in re.findall(r"^(?:#|ℹ) fail (\d+)$", text, flags=re.MULTILINE))

          missing_packages = sorted(expected_packages - found_packages)
          outcome = os.environ.get("JOB_RESULT", "failure")

          if missing_packages:
              message = f"missing outputs: {', '.join(missing_packages)}"
              color = "red"
          elif total == 0 and outcome == "success":
              message = "passed"
              color = "brightgreen"
          elif total == 0:
              message = "failed"
              color = "red"
          else:
              message = f"{passed}/{total} passed" if failed == 0 and outcome == "success" else f"{passed}/{total} passed, {failed} failed"
              color = "brightgreen" if failed == 0 and outcome == "success" else "red"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"total={total}\n")
              handle.write(f"passed={passed}\n")
              handle.write(f"failed={failed}\n")
              handle.write(f"message={message}\n")
              handle.write(f"color={color}\n")
          PYTHON

  update_badge:
    name: Update TypeScript SDK Badge
    runs-on: ubuntu-latest
    needs: summarize_tests
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.summarize_tests.result != 'cancelled' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update TypeScript SDK badge file
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          render_badge() {
            mkdir -p .github/badges

            cat > .github/badges/sdk-typescript-tests.json <<EOF
          {
            "schemaVersion": 1,
            "label": "typescript sdk tests (${{ needs.summarize_tests.outputs.total }})",
            "message": "${{ needs.summarize_tests.outputs.message }}",
            "color": "${{ needs.summarize_tests.outputs.color }}"
          }
          EOF
          }

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B sdk-typescript-badge-update origin/main

            render_badge

            if git diff --quiet -- .github/badges/sdk-typescript-tests.json; then
              echo "TypeScript SDK badge file already up to date"
              exit 0
            fi

            git add .github/badges/sdk-typescript-tests.json
            git commit -m "docs: update typescript sdk test badge"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "TypeScript SDK badge push was not a fast-forward; retrying from latest origin/main (attempt ${attempt}/3)."
            sleep 2
          done

          echo "Failed to push TypeScript SDK badge update after retries" >&2
          exit 1

  publish:
    name: Publish TypeScript SDK packages to npm
    runs-on: ubuntu-latest
    needs:
      - resolve_versions
      - test_packages
    if: ${{ inputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        shell: bash
        run: |
          set -euo pipefail
          cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked
          wasm-pack --version

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: npm-publish
          cache-on-failure: true

      - name: Publish @kalamdb/client to npm
        shell: bash
        working-directory: link/sdks/typescript/client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve_versions.outputs.typescript_version }}"
          FORCE_FLAG=""
          if [[ "${{ inputs.force_publish }}" == "true" ]]; then
            FORCE_FLAG="--force"
          fi
          chmod +x ./publish.sh
          ./publish.sh --version "$VERSION" $FORCE_FLAG

      - name: Publish @kalamdb/consumer to npm
        shell: bash
        working-directory: link/sdks/typescript/consumer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve_versions.outputs.typescript_version }}"
          FORCE_FLAG=""
          if [[ "${{ inputs.force_publish }}" == "true" ]]; then
            FORCE_FLAG="--force"
          fi
          chmod +x ./publish.sh
          ./publish.sh --version "$VERSION" $FORCE_FLAG

      - name: Publish @kalamdb/orm to npm
        shell: bash
        working-directory: link/sdks/typescript/orm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve_versions.outputs.typescript_version }}"
          FORCE_FLAG=""
          if [[ "${{ inputs.force_publish }}" == "true" ]]; then
            FORCE_FLAG="--force"
          fi
          chmod +x ./publish.sh
          ./publish.sh --version "$VERSION" $FORCE_FLAG

      - name: Publish @kalamdb/react to npm
        shell: bash
        working-directory: link/sdks/typescript/react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve_versions.outputs.typescript_version }}"
          FORCE_FLAG=""
          if [[ "${{ inputs.force_publish }}" == "true" ]]; then
            FORCE_FLAG="--force"
          fi
          chmod +x ./publish.sh
          ./publish.sh --version "$VERSION" $FORCE_FLAG

  publish_github_packages:
    name: Publish TypeScript SDK packages to GitHub Packages
    runs-on: ubuntu-latest
    needs:
      - resolve_versions
      - test_packages
    if: ${{ inputs.publish_github_packages }}
    env:
      PUBLISH_REGISTRY_URL: 'https://npm.pkg.github.com'
      PUBLISH_REGISTRY_NAME: 'GitHub Packages'
      PUBLISH_ACCESS: ''
      PUBLISH_SCOPE_OVERRIDE: '@kalamdb'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        shell: bash
        run: |
          set -euo pipefail
          cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked
          wasm-pack --version

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: github-packages-publish
          cache-on-failure: true

      - name: Publish @kalamdb/client to GitHub Packages
        shell: bash
        working-directory: link/sdks/typescript/client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve_versions.outputs.typescript_version }}"
          FORCE_FLAG=""
          if [[ "${{ inputs.force_publish }}" == "true" ]]; then
            FORCE_FLAG="--force"
          fi
          chmod +x ./publish.sh
          ./publish.sh --version "$VERSION" $FORCE_FLAG

      - name: Publish @kalamdb/consumer to GitHub Packages
        shell: bash
        working-directory: link/sdks/typescript/consumer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve_versions.outputs.typescript_version }}"
          FORCE_FLAG=""
          if [[ "${{ inputs.force_publish }}" == "true" ]]; then
            FORCE_FLAG="--force"
          fi
          chmod +x ./publish.sh
          ./publish.sh --version "$VERSION" $FORCE_FLAG

      - name: Publish @kalamdb/orm to GitHub Packages
        shell: bash
        working-directory: link/sdks/typescript/orm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve_versions.outputs.typescript_version }}"
          FORCE_FLAG=""
          if [[ "${{ inputs.force_publish }}" == "true" ]]; then
            FORCE_FLAG="--force"
          fi
          chmod +x ./publish.sh
          ./publish.sh --version "$VERSION" $FORCE_FLAG

      - name: Publish @kalamdb/react to GitHub Packages
        shell: bash
        working-directory: link/sdks/typescript/react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve_versions.outputs.typescript_version }}"
          FORCE_FLAG=""
          if [[ "${{ inputs.force_publish }}" == "true" ]]; then
            FORCE_FLAG="--force"
          fi
          chmod +x ./publish.sh
          ./publish.sh --version "$VERSION" $FORCE_FLAG