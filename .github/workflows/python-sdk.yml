name: Python SDK

on:
  push:
    branches: [main]
    paths:
      - 'link/sdks/python/**'
      - 'link/sdks/rust/**'
      - 'link/link-common/**'
      - '.github/workflows/python-sdk.yml'
  # The generated bindings are part of the SDK's contract, so the schema-gen
  # target, its template, the checked-in example and the shared contract
  # fixtures all gate a pull request too.
  pull_request:
    paths:
      - 'link/sdks/python/**'
      - 'link/sdks/rust/**'
      - 'link/link-common/**'
      - 'cli/src/workflow/schema/**'
      - 'cli/templates/schema-gen/python/**'
      - 'link/tests/sdk-contracts/**'
      - 'examples/simple-python/**'
      - 'scripts/test-python-sdk-release.sh'
      - '.github/workflows/python-sdk.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish wheels to PyPI"
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      publish:
        description: "Publish wheels to PyPI"
        type: boolean
        required: false
        default: false

env:
  CARGO_TERM_COLOR: always
  CARGO_ENCODED_RUSTFLAGS: ""
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        exclude:
          # ubuntu-latest is Ubuntu 26.04 now, and setup-python publishes no
          # 3.9 build for it: 3.9 is end of life, so the newer images stopped
          # carrying it. macOS and Windows still have one.
          - os: ubuntu-latest
            python-version: "3.9"
        include:
          # 3.9 is still the floor in pyproject.toml, so it stays covered on
          # Linux at the newest image that has it. Drop this entry along with
          # the floor when 3.9 support goes.
          - os: ubuntu-24.04
            python-version: "3.9"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: link/sdks/python -> target

      - name: Create venv and install maturin + pytest
        working-directory: link/sdks/python
        shell: bash
        run: |
          python -m venv .venv
          if [ -f .venv/bin/activate ]; then source .venv/bin/activate; else source .venv/Scripts/activate; fi
          python -m pip install --upgrade pip
          pip install maturin pytest pytest-asyncio

      - name: Build SDK in develop mode (inside venv)
        working-directory: link/sdks/python
        shell: bash
        run: |
          if [ -f .venv/bin/activate ]; then source .venv/bin/activate; else source .venv/Scripts/activate; fi
          maturin develop --release

      - name: Run unit tests (no server required)
        working-directory: link/sdks/python
        shell: bash
        run: |
          if [ -f .venv/bin/activate ]; then source .venv/bin/activate; else source .venv/Scripts/activate; fi
          pytest tests/test_auth.py tests/test_exceptions.py tests/test_agent.py tests/test_schema.py tests/test_codecs.py -v

  # Everything that needs more than the unit tests: generated bindings that are
  # up to date and strictly typed, plus a round trip against a fresh server.
  contract:
    name: Generated bindings and fresh-server smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: python-sdk-contract

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev pkg-config libssl-dev

      # Both binaries come from this commit. The TypeScript and Dart workflows
      # download a released server instead, but they only run on dispatch; as a
      # pull request gate that adds a releases-API lookup and an asset download
      # that can fail for reasons the change had nothing to do with. Building
      # also means the smoke test checks the SDK against the server it ships
      # with, which is the point of a contract gate.
      - name: Build the server and the kalam CLI
        run: cargo build --locked -p kalam-cli --bin kalam -p kalamdb-server

      - name: Create venv and build the SDK
        run: |
          set -euo pipefail
          python -m venv link/sdks/python/.venv
          source link/sdks/python/.venv/bin/activate
          python -m pip install --upgrade pip
          pip install maturin pytest pytest-asyncio mypy
          cd link/sdks/python && maturin develop

      - name: Run the Python SDK contract gates
        env:
          KALAMDB_SERVER_BIN: ${{ github.workspace }}/target/debug/kalamdb-server
          PYTHON_SDK_SERVER_LOG: ${{ github.workspace }}/python-sdk-server.log
          KALAMDB_ROOT_PASSWORD: "kalamdb123"
          KALAMDB_USER: "root"
        run: |
          set -euo pipefail
          PYTHON_BIN="$PWD/link/sdks/python/.venv/bin/python" \
            bash scripts/test-python-sdk-release.sh

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-sdk-server-log
          path: python-sdk-server.log
          if-no-files-found: ignore
          retention-days: 7

  # Wheels are an artifact of a release, not a pull-request gate.
  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: link/sdks/python
          command: build
          args: --release --strip --out dist
          rust-toolchain: "1.99.1"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: link/sdks/python/dist/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: link/sdks/python
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: link/sdks/python/dist/*.tar.gz

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist]
    if: ${{ inputs.publish }}
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

      - name: Checkout
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Record published Python SDK versions
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/versions.py mark-published --group python --write
          if git diff --quiet -- versions.json; then
            echo "published versions already recorded"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git commit -m "chore: record published Python SDK versions"
          git push origin HEAD:main
