[package]
name = "kalam-cli-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Server-backed integration tests for kalam-cli (not published)"
publish = false
autotests = false

[features]
default = []
# MinIO tests. Off by default so workspace `cargo nextest` does not unify the AWS SDK.
cloud-aws = ["dep:object_store", "object_store/aws"]
# Dex/testcontainers OIDC e2e. Off by default so Docker crates stay out of CI.
oidc = ["dep:testcontainers-modules"]

[lib]
path = "src/lib.rs"
doctest = false
test = false

[dependencies]
# Optional crates must be [dependencies]; Cargo forbids optional [dev-dependencies].
object_store = { workspace = true, optional = true }
testcontainers-modules = { workspace = true, optional = true }

[build-dependencies]
chrono = { workspace = true }

[dev-dependencies]
kalam-cli = { path = ".." }
kalam-client = { workspace = true, features = ["native-cli"] }
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
dotenv = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
regex = { workspace = true }
ntest = { workspace = true }
wait-timeout = { workspace = true }
kalamdb-commons = { workspace = true, features = ["full"] }
kalamdb-configs = { workspace = true }
jsonwebtoken = { workspace = true }
sysinfo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
libc = { workspace = true }
rand = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
url = { workspace = true }
openidconnect = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
zip = { workspace = true }
clap = { workspace = true }
humantime = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[[test]]
name = "e2e"
path = "tests/e2e.rs"
