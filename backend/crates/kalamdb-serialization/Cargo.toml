[package]
name = "kalamdb-serialization"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Central persisted-object codec for KalamDB"
keywords = ["kalamdb", "serialization", "storage"]
categories = ["database", "encoding"]

[dependencies]
kalamdb-commons = { path = "../kalamdb-commons", default-features = false, features = ["serde"] }
arrow = { workspace = true, optional = true }
datafusion-common = { workspace = true, default-features = false, optional = true }
flexbuffers = { workspace = true }
rmp-serde = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[features]
default = ["backend-adapters"]
backend-adapters = [
    "dep:arrow",
    "dep:datafusion-common",
    "kalamdb-commons/conversions",
    "kalamdb-commons/rows",
    "kalamdb-commons/table-definition",
]

[dev-dependencies]
criterion = { workspace = true }

[lib]
name = "kalamdb_serialization"
path = "src/lib.rs"

[[bench]]
name = "codec"
harness = false
