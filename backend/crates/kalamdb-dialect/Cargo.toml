[package]
name = "kalamdb-dialect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "KalamDB SQL dialect, parser, and statement classification"

[dependencies]
kalamdb-commons = { path = "../kalamdb-commons", features = ["serde", "rows", "scheduling"] }
datafusion-common = { workspace = true, default-features = false }
kalamdb-session = { path = "../kalamdb-session" }

arrow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlparser = { workspace = true, features = ["visitor", "derive-dialect"] }
regex = { workspace = true }
once_cell = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
sha2 = { workspace = true }

humantime = { workspace = true }
